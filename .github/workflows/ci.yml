on:
  push:
    branches: [ main, coq-master ]
    tags:
      - "v*.*.*"
  pull_request:
    # `labeled` is here so that adding the `ci-full` label starts a run. Without
    # it the label fires nothing, and "Re-run all jobs" replays the payload the
    # run started with, which predates the label. Declaring `types` overrides
    # the defaults, so the other three have to be listed explicitly.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# One run per ref: a second push to a PR cancels the first instead of stacking
# another ~40 jobs behind it. Deliberately not on main or on tags, where
# cancelling would leave a commit without a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix-plan:
    # Decides which cells this run schedules. GitHub caps concurrent macOS
    # runners at 5 while the full matrix asks for 16 of them, so a pull request
    # gets a reduced set of macOS cells and everything else gets all of them.
    # Label a pull request `ci-full` to get the complete matrix on demand.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nix: ${{ steps.cells.outputs.nix }}
      opam: ${{ steps.cells.outputs.opam }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Plan the matrix
      id: cells
      env:
        FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
      run: python3 .github/scripts/ci-matrix.py

  build-extension:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
    - run: |
        cd client
        npm run package

  nix-dev-build:
    needs: matrix-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-plan.outputs.nix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Configure Dune
      run: |
        mkdir -p ~/.config/dune
        cat <<EOF > ~/.config/dune/config
        (lang dune 3.2)
        (display short)
        EOF
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Check each yarn.nix up to date
      if: false
      run: |
        cd client && nix-shell -p yarn2nix --run "yarn2nix > new_yarn.nix"
        cd goal-view-ui && nix-shell -p yarn2nix --run "yarn2nix > new_yarn.nix"
        cd ../search-ui && nix-shell -p yarn2nix --run "yarn2nix > new_yarn.nix" && cd ..
        nix fmt new_yarn.nix goal-view-ui/new_yarn.nix search-ui/new_yarn.nix
        nix fmt yarn.nix goal-view-ui/yarn.nix search-ui/yarn.nix
        diff new_yarn.nix yarn.nix
        diff goal-view-ui/new_yarn.nix goal-view-ui/yarn.nix
        diff search-ui/new_yarn.nix search-ui/yarn.nix
    - run: nix develop .#vsrocq-${{ matrix.coq }} -c bash -c "cd language-server && make dune-files && dune build --profile ${{ matrix.profile }}"
      if: ${{matrix.coq != 9}}
    - run: nix develop .#vsrocq-${{ matrix.coq }} -c bash -c "cd language-server && make dune-files && dune build --profile ${{ matrix.profile }}"
      if: ${{matrix.coq == 9}}
    - run: nix develop .#vsrocq-${{ matrix.coq }} -c bash -c "cd client && npm install && npm run build --workspaces"
    - name: Test xvfb
      uses: Wandalen/wretry.action@v3
      with:
        attempt_limit: 5
        attempt_delay: 5000
        command: |
            xvfb-run nix develop .#vsrocq-${{ matrix.coq }} -c bash -c "cd client && npm test"
      if: runner.os == 'Linux'
    - name: Test
      uses: Wandalen/wretry.action@v3
      with:
        attempt_limit: 5
        attempt_delay: 5000
        command: |
            nix develop .#vsrocq-${{ matrix.coq }} -c bash -c "cd client && npm test"
      if: runner.os != 'Linux'
    - if: ${{ failure() }}
      run: cat /tmp/vsrocq_init_log.*

  install-opam:
    needs: matrix-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-plan.outputs.opam) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use OCaml ${{ matrix.ocaml-compiler }}
      uses: avsm/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml-compiler }}

    - name: Install vsrocq-language-server
      env:
        OPAMYES: true
      run: |
        if [ "`echo "${{ matrix.coq }}" | sed 's/dev$//'`" != "${{ matrix.coq }}" ]; then
          opam repo add rocq-core-dev https://rocq-prover.org/opam/core-dev
          opam install rocq-core.dev
        else
          if [ "${{ startsWith(matrix.coq,'8') }}" = "true" ]; then
            opam pin add coq-core ${{ matrix.coq }}
            opam pin add coq-stdlib ${{ matrix.coq }}
          else
            opam pin add rocq-core ${{ matrix.coq }}  
          fi
        fi
        opam pin add vsrocq-language-server ./language-server/ --with-doc --with-test -y

    - run: |
        eval $(opam env)
        echo "vsrocqtop=`which vsrocqtop`" >> $GITHUB_ENV
        vsrocqtop -v

    - uses: actions/setup-node@v3
      if: runner.os == 'Linux'
      with:
        node-version: 22

    - run: cd client && npm run package
      if: runner.os == 'Linux'
    - run: |
        eval $(opam env) && cd client && xvfb-run npm test
      if: runner.os == 'Linux'
      env:
        VSROCQPATH: ${{ env.vsrocqtop }}
        VSROCQARGS: "-bt"
    - if: runner.os == 'Linux' && failure()
      run: cat /tmp/vsrocq_init_log.*

  install-opam-windows:
    # Replaces a job that had been disabled since it was written: it drove
    # coq/platform's coq_platform_make_windows.bat against a self-hosted
    # C:\ci\cygwin64 image, pinned COQ_VERSION to V8.18+rc1, and was carried as
    # `if: false`. opam builds Rocq on Windows unattended now, so the platform
    # detour is no longer needed.
    strategy:
      fail-fast: false
      matrix:
        environment: [cygwin, msys2]
        coq: [ "9.2.0" ]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OPAMYES: true
    steps:
    # The runner image sets core.autocrlf=true globally, and the build reads the
    # dune.in files through Cygwin tools, which do not tolerate CRLF.
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "4.14"
        opam-pin: false
        windows-environment: ${{ matrix.environment }}

    - name: Install Rocq
      run: opam pin add rocq-core ${{ matrix.coq }}

    # arch-x86_64 is a virtual package that defines opam's `arch` variable.
    # setup-ocaml selects the 0install solver, which satisfies this install by
    # swapping in arch-x86_32 and rebuilding the compiler as 32-bit mingw, and
    # the language server does not build there: vsrocqtop/lspManager.ml holds an
    # integer literal of 4000000000, which does not fit a 30-bit int. Naming
    # arch-x86_64 in the request keeps it in the solution. It has to be this
    # request rather than a step of its own, because `opam install arch-x86_64`
    # on a switch that already has it answers "already installed", changes
    # nothing, and leaves the install that follows free to flip the switch.
    #
    # The package does carry `available: arch != "arm32" & arch != "x86_32"`,
    # but available: is evaluated against the switch's variables as they stand,
    # so it cannot stop a solver moving the switch to an architecture where the
    # package is then unavailable. opam's own default solver never picks that
    # plan, so this is a property of how CI configures opam and not something
    # that reaches people installing the package by hand.
    - name: Install vsrocq-language-server
      run: |
        opam pin add vsrocq-language-server ./language-server/ --no-action
        opam install vsrocq-language-server arch-x86_64 --with-test

    - name: Check it runs
      run: opam exec -- vsrocqtop -v

  dev-setup-opam:
    strategy:
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: [4.14.x]
        profile: [dev, fatalwarnings]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use OCaml ${{ matrix.ocaml-compiler }}
      uses: avsm/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml-compiler }}

    - name: Install deps
      env:
        OPAMYES: true
      run: |
        opam repo add rocq-core-dev https://rocq-prover.org/opam/core-dev
        opam install dune
        opam install rocq-core=dev
        opam install ./language-server/vsrocq-language-server.opam --deps-only --with-doc --with-test --ignore-constraints-on dune
      
    - name: Build vsrocq-language-server
      run: |
        eval $(opam env)
        cd language-server && make ${{ matrix.profile }}

    - name: Unit tests
      run: |
        eval $(opam env)
        cd language-server && make test

    - uses: actions/setup-node@v3
      with:
        node-version: 22

    - run: |
        eval $(opam env)
        echo vsrocqlib="$( echo -n "-coqlib "; (rocq -where || coqc -where) 2>/dev/null )" >> $GITHUB_ENV

    - run: cd client && npm install && npm run build --workspaces
    - run: cd client && xvfb-run npm test
      env:
        VSROCQARGS: "${{ env.vsrocqlib }}"

    - if: ${{ failure() }}
      run: cat /tmp/vsrocq_init_log.*


  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-extension, nix-dev-build, install-opam, dev-setup-opam]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4

      - name: Create language-server archive
        run: |
          cd language-server
          VERSION="${GITHUB_REF_NAME_SLUG#v}"
          git archive -o ../vsrocq-language-server-$VERSION.tar.gz --prefix=vsrocq-language-server-$VERSION/ $GITHUB_SHA .

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vsrocq-language-server-*.tar.gz
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          generate_release_notes: true

  publish-extension:
    runs-on: ubuntu-latest
    if: success()
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
    - name: Pre publish phase
      run: |
        cd client
        npm run package
    - name: Publish to Open VSX Registry
      uses: HaaLeo/publish-vscode-extension@v1.6.2
      id: publishToOpenVSX
      with:
        pat: 'stub'
        packagePath: ./client/
        preRelease: false
        dryRun: true
    - name: Publish to Visual Studio Marketplace
      uses: HaaLeo/publish-vscode-extension@v1.6.2
      with:
        pat: 'stub'
        packagePath: ./client/
        registryUrl: https://marketplace.visualstudio.com
        extensionFile: ${{ steps.publishToOpenVSX.outputs.vsixPath }}
        preRelease: false
        dryRun: true
