name: probe-819

# Temporary diagnostic workflow: is the intermittent
#   "utils/warnings.ml, line 491 ... Assertion failed"
# failure when building coq-core.8.19.0 on macos-latest/arm64
# caused by dune's build parallelism (-j)?
#
# Two arms, one per branch:
#   probe-819-jobs2  -> OPAMJOBS: 2  (control, reproduces today's CI)
#   probe-819-jobs1  -> OPAMJOBS: 1  (treatment)
#
# Round 1 (1 trial/job, 6 jobs/arm) gave control 1/6, treatment 0/6 --
# directionally right but statistically empty. The ~4 min setup-ocaml step
# dominates job time, so amortise it: 5 trials per job x 6 jobs = 30 trials
# per arm, for the same number of runners.

on: [push, workflow_dispatch]

env:
  TRIALS: 10

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    env:
      OPAMYES: true
      OPAMJOBS: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use OCaml 4.14.2
      uses: avsm/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.2

    - name: Report environment
      run: |
        echo "replica    = ${{ matrix.replica }}"
        echo "OPAMJOBS   = $OPAMJOBS"
        echo "opam jobs  = $(opam var jobs)"
        echo "arch       = $(uname -m)"
        opam --version
        opam exec -- ocamlc -version

    # Each trial is a full from-scratch build of coq-core.8.19.0.
    # Trials never abort the job: we count outcomes and report at the end.
    - name: Run trials
      run: |
        fails=0; asserts=0
        for i in $(seq 1 "$TRIALS"); do
          opam pin remove coq-core -y >/dev/null 2>&1 || true
          if opam pin add coq-core 8.19.0 >"/tmp/trial$i.log" 2>&1; then
            echo "trial $i: PASS"
          else
            fails=$((fails + 1))
            if grep -q 'warnings.ml", line 491' "/tmp/trial$i.log"; then
              asserts=$((asserts + 1))
              echo "trial $i: FAIL warnings.ml:491"
              grep -o 'dune build -p coq-core -j [0-9]*' "/tmp/trial$i.log" | head -1
              grep -o '\-intf [^ )]*' "/tmp/trial$i.log" | sort -u | head -3
            else
              echo "trial $i: FAIL other"
              tail -25 "/tmp/trial$i.log"
            fi
          fi
        done
        echo "SUMMARY replica=${{ matrix.replica }} jobs=$OPAMJOBS trials=$TRIALS fails=$fails asserts=$asserts"
