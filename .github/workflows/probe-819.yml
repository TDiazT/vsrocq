name: probe-819

# Temporary diagnostic workflow: is the intermittent
#   "utils/warnings.ml, line 491 ... Assertion failed"
# failure when building coq-core.8.19.0 on macos-latest/arm64
# caused by dune's build parallelism (-j)?
#
# Three arms, one per branch:
#   probe-819-jobs1  -> OPAMJOBS: 1
#   probe-819-jobs2  -> OPAMJOBS: 2  (what CI does today)
#   probe-819-jobs4  -> OPAMJOBS: 4  (oversubscribes the 3-vCPU runner)
#
# Round 4. Rounds 2-3 were invalid: `opam pin remove` does not uninstall the
# package, so re-pinning the same version returned in ~7s without rebuilding
# and only the first trial per job was an independent build. Fixed by
# uninstalling explicitly. Each trial now asserts it took >60s, so a silently
# cached trial can never again be counted as a real one.

on: [push, workflow_dispatch]

env:
  TRIALS: 10

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      OPAMYES: true
      OPAMJOBS: 4
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use OCaml 4.14.2
      uses: avsm/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.2

    - name: Report environment
      run: |
        echo "replica    = ${{ matrix.replica }}"
        echo "OPAMJOBS   = $OPAMJOBS"
        echo "opam jobs  = $(opam var jobs)"
        echo "arch       = $(uname -m)"
        opam --version
        opam exec -- ocamlc -version

    # Each trial is a full from-scratch build of coq-core.8.19.0.
    # Trials never abort the job: outcomes are counted and reported at the end.
    - name: Run trials
      run: |
        fails=0; asserts=0; cached=0
        for i in $(seq 1 "$TRIALS"); do
          # Removing the pin alone does NOT uninstall the package, so re-pinning
          # the same version is a no-op. Uninstall to force a real rebuild.
          opam pin remove coq-core -y >/dev/null 2>&1 || true
          opam uninstall coq-core -y  >/dev/null 2>&1 || true

          t0=$(date +%s)
          if opam pin add coq-core 8.19.0 >"/tmp/trial$i.log" 2>&1; then
            outcome=PASS
          else
            outcome=FAIL
            fails=$((fails + 1))
            if grep -q 'warnings.ml", line 491' "/tmp/trial$i.log"; then
              asserts=$((asserts + 1)); outcome="FAIL warnings.ml:491"
              grep -o 'dune build -p coq-core -j [0-9]*' "/tmp/trial$i.log" | head -1
              grep -o '\-intf [^ )]*' "/tmp/trial$i.log" | sort -u | head -3
            else
              outcome="FAIL other"
              tail -25 "/tmp/trial$i.log"
            fi
          fi
          secs=$(( $(date +%s) - t0 ))

          # A genuine coq-core build takes minutes. Anything fast was served
          # from an existing install and must not be counted as a trial.
          if [ "$secs" -lt 60 ]; then
            cached=$((cached + 1))
            echo "trial $i: ${outcome} (${secs}s) *** NOT AN INDEPENDENT BUILD ***"
          else
            echo "trial $i: ${outcome} (${secs}s)"
          fi
        done
        echo "SUMMARY replica=${{ matrix.replica }} jobs=$OPAMJOBS trials=$TRIALS fails=$fails asserts=$asserts cached=$cached"
